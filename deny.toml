[graph]
targets = []

[bans]
multiple-versions = "deny"
wildcard-deps = "deny"
deny-all-duplicates = true

[licenses]
unlicensed = "deny"
allow-osi-fsf-free = true
copyleft = "deny"
confidence-threshold = 0.9
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["crates-io"]
